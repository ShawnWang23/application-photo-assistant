# Retry after validating the Windows compiler path.
name: publish-v4-bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v4-bootstrap.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and verify release
        shell: pwsh
        run: .\build_windows.ps1
      - name: Publish v4.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\dist\installer\*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact not found" }
          gh release create v4.0.0 `
            .\dist\ApplicationPhotoAssistant.exe `
            $installer.FullName `
            .\dist\SHA256SUMS.txt `
            --target $env:GITHUB_SHA `
            --title "Application Photo Assistant v4.0.0" `
            --notes-file .\docs\RELEASE_NOTES_4.0.0.md
