name: build-and-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-dev.txt
      - name: Test and lint
        run: |
          python -m pytest
          python -m ruff check .
      - name: Read and verify version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from photo_assistant.version import __version__; print(__version__)"
          "value=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }
      - name: Build portable executable
        run: |
          python scripts/generate_icon.py
          python scripts/generate_version_info.py
          python -m PyInstaller --noconfirm --clean ApplicationPhotoAssistant.spec
      - name: Verify packaged application
        shell: pwsh
        run: |
          & .\dist\ApplicationPhotoAssistant.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed: $LASTEXITCODE" }
          & .\dist\ApplicationPhotoAssistant.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Smoke-test failed: $LASTEXITCODE" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" "installer\ApplicationPhotoAssistant.iss"
      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem .\dist -Recurse -File | Where-Object Extension -eq ".exe"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath((Resolve-Path .\dist), $file.FullName).Replace("\", "/")
            "$hash  $relative"
          }
          Set-Content .\dist\SHA256SUMS.txt $lines -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ApplicationPhotoAssistant-${{ steps.version.outputs.value }}-windows-x64
          path: |
            dist/ApplicationPhotoAssistant.exe
            dist/installer/*.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\dist\installer\*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact not found" }
          gh release create $env:GITHUB_REF_NAME `
            .\dist\ApplicationPhotoAssistant.exe `
            $installer.FullName `
            .\dist\SHA256SUMS.txt `
            --title "Application Photo Assistant $env:GITHUB_REF_NAME" `
            --generate-notes
