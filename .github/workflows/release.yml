name: build-and-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-dev.txt
      - name: Test and lint
        run: |
          python -m pytest
          python -m ruff check .
      - name: Read and verify version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from photo_assistant.version import __version__; print(__version__)"
          "value=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }
      - name: Build portable executable
        run: |
          python scripts/generate_icon.py
          python scripts/generate_version_info.py
          python -m PyInstaller --noconfirm --clean ApplicationPhotoAssistant.spec
      - name: Verify packaged application
        shell: pwsh
        run: |
          $selfTest = Start-Process `
            -FilePath .\dist\ApplicationPhotoAssistant.exe `
            -ArgumentList "--self-test" `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Self-test failed: $($selfTest.ExitCode)" }
          $smokeTest = Start-Process `
            -FilePath .\dist\ApplicationPhotoAssistant.exe `
            -ArgumentList "--smoke-test" `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($smokeTest.ExitCode -ne 0) { throw "Smoke-test failed: $($smokeTest.ExitCode)" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" "installer\ApplicationPhotoAssistant.iss"
      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem .\dist -Recurse -File | Where-Object Extension -eq ".exe"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath((Resolve-Path .\dist), $file.FullName).Replace("\", "/")
            "$hash  $relative"
          }
          Set-Content .\dist\SHA256SUMS.txt $lines -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ApplicationPhotoAssistant-${{ steps.version.outputs.value }}-windows-x64
          path: |
            dist/ApplicationPhotoAssistant.exe
            dist/installer/*.exe
            dist/SHA256SUMS.txt
  publish:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ApplicationPhotoAssistant-${{ needs.windows.outputs.version }}-windows-x64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\dist\installer\*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact not found" }
          $displayVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          gh release create $env:GITHUB_REF_NAME `
            .\dist\ApplicationPhotoAssistant.exe `
            $installer.FullName `
            .\dist\SHA256SUMS.txt `
            --title "Application Photo Assistant · $displayVersion" `
            --generate-notes
